<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milliseconds until I can play GTA6</title>
  <style>
    :root {
      --bg: #07070b;
      --fg: #f5f3ef;
      --muted: #8b8698;
      --accent: #ff4d9d;
      --accent2: #37e8c3;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0%, #1d1033 0%, var(--bg) 60%);
      color: var(--fg);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    /* Everything lives in a width-capped wrapper so an oversized number can
       never widen the flex container and knock the rest off-centre. */
    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      max-width: 100%;
      overflow-wrap: break-word;
      margin: 0 0 clamp(1rem, 4vh, 2.5rem);
      font-size: clamp(1.1rem, 4.2vw, 2.4rem);
      font-weight: 800;
      letter-spacing: .02em;
      line-height: 1.2;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    #count {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(2.6rem, 13vw, 11rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum" 1;
      text-shadow: 0 0 36px rgba(255, 77, 157, .35);
      /* Kept on one line; fitCount() shrinks it if it would overflow. */
      white-space: nowrap;
      max-width: 100%;
    }

    .unit {
      margin-top: .6rem;
      font-size: clamp(.8rem, 2.4vw, 1.2rem);
      letter-spacing: .38em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .breakdown {
      margin-top: clamp(1.5rem, 5vh, 3rem);
      display: flex;
      gap: clamp(.8rem, 4vw, 2.5rem);
      flex-wrap: wrap;
      justify-content: center;
    }
    .breakdown div { min-width: 3.5rem; }
    .breakdown .n {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: clamp(1.2rem, 4vw, 2.1rem);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    .breakdown .l {
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: .25rem;
    }

    .target {
      margin-top: clamp(1.5rem, 5vh, 3rem);
      color: var(--muted);
      font-size: clamp(.75rem, 2.2vw, .95rem);
    }

    body.done #count {
      font-size: clamp(2rem, 9vw, 7rem);
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      animation: pulse 1.1s ease-in-out infinite;
    }
    body.done .unit, body.done .breakdown { display: none; }
    @keyframes pulse { 50% { opacity: .55; } }

    @media (prefers-reduced-motion: reduce) {
      body.done #count { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Milliseconds until I can play GTA6</h1>

    <div id="count" role="timer" aria-live="off">&nbsp;</div>
    <div class="unit" id="unit">milliseconds</div>

    <div class="breakdown" id="breakdown" aria-hidden="true">
      <div><div class="n" id="d">0</div><div class="l">days</div></div>
      <div><div class="n" id="h">00</div><div class="l">hours</div></div>
      <div><div class="n" id="m">00</div><div class="l">mins</div></div>
      <div><div class="n" id="s">00</div><div class="l">secs</div></div>
    </div>

    <p class="target" id="target"></p>
  </main>

  <script>
    // Midnight at the start of 19 November 2026, in the viewer's local timezone.
    // Month is 0-indexed, so 10 === November.
    const TARGET = new Date(2026, 10, 19, 0, 0, 0, 0);

    const countEl = document.getElementById('count');
    const unitEl = document.getElementById('unit');
    const bdEl = document.getElementById('breakdown');
    const dEl = document.getElementById('d');
    const hEl = document.getElementById('h');
    const mEl = document.getElementById('m');
    const sEl = document.getElementById('s');

    document.getElementById('target').textContent =
      'Target: ' + TARGET.toLocaleString(undefined, {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });

    const pad = (n, w = 2) => String(n).padStart(w, '0');

    // Shrink the number if it would overflow its container. Only re-measured
    // when the digit count changes or the window resizes, never every frame.
    const wrapEl = document.querySelector('.wrap');
    let lastFitKey = '';

    function fitCount(force) {
      const key = countEl.textContent.length + 'x' + wrapEl.clientWidth;
      if (!force && key === lastFitKey) return;
      lastFitKey = key;

      countEl.style.fontSize = '';           // fall back to the CSS clamp
      const base = parseFloat(getComputedStyle(countEl).fontSize);
      const available = wrapEl.clientWidth;
      const needed = countEl.scrollWidth;
      if (needed > available && needed > 0) {
        countEl.style.fontSize = Math.max(14, base * (available / needed) * 0.97) + 'px';
      }
    }

    window.addEventListener('resize', () => fitCount(true));

    function tick() {
      const remaining = TARGET.getTime() - Date.now();

      if (remaining <= 0) {
        document.body.classList.add('done');
        countEl.textContent = '🎮 GTA6 TIME 🎮';
        countEl.setAttribute('aria-live', 'polite');
        document.title = 'GTA6 time!';
        fitCount(true);
        return; // stop the loop
      }

      countEl.textContent = remaining.toLocaleString('en-US');
      fitCount(false);

      const totalSeconds = Math.floor(remaining / 1000);
      dEl.textContent = Math.floor(totalSeconds / 86400);
      hEl.textContent = pad(Math.floor(totalSeconds / 3600) % 24);
      mEl.textContent = pad(Math.floor(totalSeconds / 60) % 60);
      sEl.textContent = pad(totalSeconds % 60);

      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
